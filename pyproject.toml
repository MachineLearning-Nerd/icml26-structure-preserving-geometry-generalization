[project]
name = "icml26-repro-RtnSbA5AUV-geo-new-conservation"
version = "0.1.0"
description = "Clean-room repro of Geo-NeW (FEEC exact conservation in neural PDEs), ICML 2026, OpenReview RtnSbA5AUV."
requires-python = ">=3.11,<3.13"
dependencies = ["numpy", "scipy", "torch", "scikit-fem"]
[tool.pytest.ini_options]
pythonpath = ["repro/src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
